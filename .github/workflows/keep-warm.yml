# Render's free tier shuts the service down after ~15 min idle; the next visit
# then waits ~30-60s for a cold start, which reads as "the app is stuck".
# Pinging every 5 min keeps it up during waking hours (05:00-21:59 UTC ≈
# 08:00-00:59 Israel). That is ~17h/day ≈ 520 of the 750 free instance-hours
# per month, so it stays inside the free allowance. Outside that window the
# service sleeps as usual.
name: keep-warm

on:
  schedule:
    - cron: '*/5 5-21 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          curl -sS -m 120 -o /dev/null \
            -w 'status=%{http_code} total=%{time_total}s\n' \
            https://life-os-li19.onrender.com/api/health
