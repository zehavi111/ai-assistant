services:
  - type: web
    name: life-os
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && (git rev-list --count HEAD > VERSION || true)
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: "3.12.6"
